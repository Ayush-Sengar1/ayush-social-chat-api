name: Deploy Social Chat client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        env:
          VITE_API_URL: https://ayush-social-chat-api-production.up.railway.app
          VITE_SOCKET_URL: https://ayush-social-chat-api-production.up.railway.app
        run: |
          printf 'import {defineConfig} from "vite";\nimport react from "@vitejs/plugin-react";\nexport default defineConfig({base:"/ayush-social-chat-api/",plugins:[react()]});\n' > client/vite.pages.config.js
          cd client
          npx vite build --config vite.pages.config.js --outDir ../dist
          touch ../dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
